[project]
name = "bookledger"
version = "0.1.0"
description = "Personal book inventory across ebook and audiobook libraries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookledger"]
